<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>QR Pass Check-In Scanner</title>
  <style>
    :root {
      --navy: #003087;
      --navy-dark: #001b4d;
      --qr-blue: #1a4fd6;
      --qr-blue-dark: #133ba3;
      --success: #006638;
      --success-bg: #e8f5ee;
      --danger: #003087;
      --danger-bg: #fdecee;
      --ink: #131c2e;
      --ink-muted: #526075;
      --bg: #eef2f7;
      --surface: #ffffff;
      --surface-subtle: #f7f9fc;
      --border: #d4deec;
      --line: #e6edf7;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 20px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.5;
    }

    .card {
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 32, 96, 0.10);
      border: 1px solid rgba(0, 48, 135, 0.08);
    }

    .hdr {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: #fff;
      padding: 20px 24px;
      border-bottom: 4px solid var(--danger);
    }

    .hdr-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c5d6f3;
      margin-bottom: 2px;
    }

    .hdr h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .body { padding: 24px; }

    .status {
      padding: 12px 16px;
      border-left: 5px solid var(--navy);
      background: var(--surface-subtle);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 16px;
    }

    .status.ok { border-color: var(--success); background: var(--success-bg); }
    .status.error { border-color: var(--danger); background: var(--danger-bg); }

    .reader-wrap {
      background: #0b1324;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: #c5d6f3;
      text-align: center;
      padding: 12px;
    }

    #qr-reader { width: 100%; }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-full {
      grid-column: 1 / -1;
    }

    .btn {
      min-height: 54px;
      padding: 12px 18px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      border-radius: 10px;
      border: 2px solid var(--navy);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--qr-blue);
      border-color: var(--qr-blue);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--qr-blue-dark);
      border-color: var(--qr-blue-dark);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--navy);
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .manual-box {
      border-top: 2px solid var(--line);
      padding-top: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .manual-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-height: 50px;
      padding: 10px 14px;
      font-size: 17px;
      font-family: inherit;
      border: 2px solid var(--border);
      border-radius: 10px;
    }

    input[type="text"]:focus,
    .btn:focus-visible {
      outline: 3px solid var(--navy);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      .btn-row, .manual-row { grid-template-columns: 1fr; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="hdr">
      <div class="hdr-eyebrow">Menarini Asia-Pacific Reception</div>
      <h1>QR Pass Check-In Scanner</h1>
    </header>

    <div class="body">
      <div id="status" class="status" role="status" aria-live="polite">
        Camera is off (Rear selected). Tap <strong>Scan QR Code</strong> when ready.
      </div>

      <div class="reader-wrap">
        <div id="qr-reader">Camera preview will appear here after you tap Scan QR Code.</div>
      </div>

      <div class="btn-row">
        <button type="button" id="startBtn" class="btn btn-primary">Scan QR Code</button>
        <button type="button" id="stopBtn" class="btn btn-secondary" disabled>Stop / Cancel</button>
        <button type="button" id="toggleCamBtn" class="btn btn-secondary btn-full">Camera: Rear (Switch to Front)</button>
      </div>

      <form id="manualForm" class="manual-box" novalidate>
        <label for="manualId">Or enter Visit ID manually</label>
        <div class="manual-row">
          <input type="text" id="manualId" maxlength="40" placeholder="e.g. VIS-2026-00001" autocomplete="off" autocapitalize="characters">
          <button type="submit" id="manualBtn" class="btn btn-secondary">Check In</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const HTML5_QRCODE_JS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';

      const params = new URLSearchParams(window.location.search);
      const KIOSK_KEY = params.get('k') || '';
      const LOCATION = params.get('loc') || 'Reception';
      const TOKEN = params.get('token') || '';
      const POST_URL = params.get('postUrl') || '';

      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const toggleCamBtn = document.getElementById('toggleCamBtn');
      const manualForm = document.getElementById('manualForm');
      const manualId = document.getElementById('manualId');
      const manualBtn = document.getElementById('manualBtn');

      let html5QrCode = null;
      let currentFacingMode = 'environment';
      let isScanning = false;
      let isSubmitting = false;

      function setStatus(type, text) {
        statusEl.className = 'status' + (type ? ' ' + type : '');
        statusEl.textContent = text;
      }

      function updateToggleButtonLabel() {
        if (currentFacingMode === 'user') {
          toggleCamBtn.textContent = 'Camera: Front (Switch to Rear)';
        } else {
          toggleCamBtn.textContent = 'Camera: Rear (Switch to Front)';
        }
      }

      function loadScannerLibrary() {
        if (typeof window.Html5Qrcode === 'function') {
          return Promise.resolve();
        }
        if (!HTML5_QRCODE_JS_URL || HTML5_QRCODE_JS_URL.indexOf('https://') !== 0) {
          return Promise.reject(new Error('HTML5_QRCODE_JS_URL is not configured with a direct https:// script URL.'));
        }
        return new Promise(function (resolve, reject) {
          const script = document.createElement('script');
          script.src = HTML5_QRCODE_JS_URL;
          script.async = true;
          script.onload = resolve;
          script.onerror = function () {
            reject(new Error('Failed to load html5-qrcode library.'));
          };
          document.head.appendChild(script);
        });
      }

      async function stopCamera() {
        if (html5QrCode && isScanning) {
          try {
            await html5QrCode.stop();
          } catch (e) {}
          try {
            html5QrCode.clear();
          } catch (e) {}
        }
        isScanning = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }

      async function startCamera() {
        if (isScanning || isSubmitting) return;
        startBtn.disabled = true;
        toggleCamBtn.disabled = true;
        const camLabel = currentFacingMode === 'user' ? 'front' : 'rear';
        setStatus('', 'Starting ' + camLabel + ' camera...');

        try {
          await loadScannerLibrary();
          html5QrCode = new window.Html5Qrcode('qr-reader');
          isScanning = true;
          stopBtn.disabled = false;

          await html5QrCode.start(
            { facingMode: currentFacingMode },
            { fps: 10, qrbox: { width: 240, height: 240 } },
            async function onScanSuccess(decodedText) {
              await stopCamera();
              await submitQrCheckIn(decodedText);
            },
            function onScanFailure() {}
          );

          setStatus('', 'Point the ' + camLabel + ' camera at your QR pass.');
        } catch (err) {
          isScanning = false;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          setStatus('error', (err && err.message) || 'Camera permission denied or unavailable.');
        } finally {
          if (!isSubmitting) {
            toggleCamBtn.disabled = false;
          }
        }
      }

      async function submitQrCheckIn(qrText) {
        if (isSubmitting) return;
        const cleaned = String(qrText || '').trim();
        if (!cleaned) {
          setStatus('error', 'Please scan a QR code or enter a Visit ID.');
          return;
        }
        if (!POST_URL || POST_URL.indexOf('https://') !== 0) {
          setStatus('error', 'Missing postUrl parameter. Open this scanner from the Kiosk Scan QR Pass screen.');
          return;
        }

        isSubmitting = true;
        startBtn.disabled = true;
        toggleCamBtn.disabled = true;
        manualBtn.disabled = true;
        setStatus('', 'Checking in...');

        try {
          const response = await fetch(POST_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'qr_checkin',
              qrText: cleaned,
              k: KIOSK_KEY,
              location: LOCATION,
              token: TOKEN
            })
          });

          const data = await response.json();
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'qr_checkin_result', result: data }, '*');
          }

          if (!data || !data.ok) {
            setStatus('error', (data && data.message) || 'Check-in failed. Please try again.');
          } else {
            setStatus(
              'ok',
              'Welcome, ' + data.firstName + '! Visit ID ' + data.visitId + ' is signed in. ' +
              (data.hostNotified ? data.hostName + ' has been notified.' : 'Please notify reception.')
            );
            manualId.value = '';
          }
        } catch (err) {
          setStatus('error', 'Network error while checking in. Please try again.');
        } finally {
          isSubmitting = false;
          startBtn.disabled = false;
          toggleCamBtn.disabled = false;
          manualBtn.disabled = false;
        }
      }

      startBtn.addEventListener('click', startCamera);

      stopBtn.addEventListener('click', async function () {
        await stopCamera();
        const camName = currentFacingMode === 'user' ? 'Front' : 'Rear';
        setStatus('', 'Camera stopped (' + camName + ' selected). Tap Scan QR Code to scan again.');
      });

      toggleCamBtn.addEventListener('click', async function () {
        if (isSubmitting) return;
        currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
        updateToggleButtonLabel();

        if (isScanning) {
          toggleCamBtn.disabled = true;
          await stopCamera();
          await startCamera();
        } else {
          const camName = currentFacingMode === 'user' ? 'Front' : 'Rear';
          setStatus('', 'Camera is off (' + camName + ' selected). Tap Scan QR Code when ready.');
        }
      });

      manualForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        await stopCamera();
        await submitQrCheckIn(manualId.value);
      });

      updateToggleButtonLabel();
      window.addEventListener('pagehide', stopCamera);
    })();
  </script>
</body>
</html>
